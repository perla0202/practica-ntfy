
name: Notificacion ntfy

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar programa Hola Mundo
        run: node hola.js

      - name: Enviar notificacion a ntfy
        run: |
          curl --fail --silent --show-error \
            -H "Title: Nuevo push a main" \
            -H "Tags: github,rocket" \
            -d "Se ha subido codigo al repositorio ${{ github.repository }}. Commit: ${{ github.sha }}" \
            https://ntfy.sh/devops-itla
